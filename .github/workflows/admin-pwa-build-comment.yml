name: Admin PWA Build Comment

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    name: Build admin_pwa
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build admin_pwa
        id: build
        continue-on-error: true
        run: pnpm --filter admin_pwa build

      - name: Comment build result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- admin-pwa-build-comment -->';
            const passed = '${{ steps.build.outcome }}' === 'success';
            const status = passed ? 'passed' : 'failed';
            const body = [
              marker,
              `admin_pwa build ${status}.`,
              passed
                ? 'Build completed successfully.'
                : 'Build failed. Check the GitHub Actions logs and fix the errors before merging.'
            ].join('\n\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const previous = comments.data.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

      - name: Fail workflow when build fails
        if: steps.build.outcome != 'success'
        run: exit 1
